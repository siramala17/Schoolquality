<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');

  :root {
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --accent: #0d9488;
    --bg: #f4f5fa;
    --surface: #ffffff;
    --text: #1e2130;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --good: #2e7d32;
    --warn: #ef6c00;
    --bad: #c62828;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Sarabun', 'Segoe UI', sans-serif; font-size: 15px; }
  h1,h2,h3,h4 { font-weight: 600; margin: 0 0 12px; }
  a { color: inherit; }

  .app-shell { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar { width: 240px; background: linear-gradient(180deg, var(--primary-dark), var(--primary));
    color: #fff; display: flex; flex-direction: column; position: fixed; top:0; left:0; bottom:0;
    z-index: 40; transition: transform .25s ease; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px; }
  .brand-icon { font-size: 26px; }
  .brand-title { font-weight: 700; font-size: 14px; letter-spacing: .5px; }
  .brand-sub { font-size: 12px; opacity: .8; }
  .nav { display: flex; flex-direction: column; gap: 2px; padding: 8px; flex: 1; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px;
    text-decoration: none; color: rgba(255,255,255,.85); font-size: 14px; cursor: pointer; }
  .nav-item:hover { background: rgba(255,255,255,.08); }
  .nav-item.active { background: rgba(255,255,255,.18); color: #fff; font-weight: 600; }
  .nav-icon { font-size: 17px; width: 20px; text-align: center; }
  .user-card { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.15); font-size: 13px; }
  .user-card .u-name { font-weight: 600; }
  .user-card .u-role { opacity: .8; font-size: 12px; }

  /* Main */
  .main { flex: 1; margin-left: 240px; min-height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--surface);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .topbar-title { font-weight: 700; font-size: 18px; }
  .menu-btn { display: none; background: none; border: none; font-size: 20px; cursor: pointer; }
  .content { padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }
  .loading { text-align: center; color: var(--text-muted); padding: 40px; }

  .view { display: none; }
  .view.active { display: block; animation: fadein .2s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to {opacity:1; transform:none;} }

  /* Cards */
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 20px; margin-bottom: 18px; }
  .sub-card { background: #f8f9fc; box-shadow: none; border: 1px solid var(--border); }
  .card-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; text-align: center; }
  .kpi-label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
  .kpi-value { font-size: 26px; font-weight: 700; color: var(--primary); }
  .kpi-good .kpi-value { color: var(--good); }
  .kpi-warn .kpi-value { color: var(--warn); }

  /* Toolbar / forms */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input[type=text] { flex: 1; min-width: 200px; }
  label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--text-muted);
    margin-bottom: 12px; font-weight: 500; }
  input, select, textarea { font-family: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--border);
    border-radius: 8px; background: #fff; color: var(--text); }
  textarea { min-height: 64px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
  .form-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

  .btn { border: 1px solid var(--border); background: #fff; color: var(--text); padding: 9px 16px;
    border-radius: 9px; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit; }
  .btn:hover { background: #f3f4f6; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-lg { padding: 12px 20px; font-size: 15px; }
  .btn-danger { color: var(--bad); }

  /* Table */
  .table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 12.5px;
    text-transform: uppercase; letter-spacing: .3px; padding: 10px 8px; border-bottom: 2px solid var(--border); }
  .table td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .table tr:hover td { background: #fafafe; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
    color: #fff; }
  .status-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .status-pending { background: #fff3e0; color: #ef6c00; }
  .status-progress { background: #e3f2fd; color: #1565c0; }
  .status-done { background: #e8f5e9; color: #2e7d32; }
  .status-cancelled { background: #fbe9e7; color: #c62828; }

  /* Modal */
  .modal { display: none; position: fixed; inset: 0; background: rgba(17,24,39,.5); z-index: 100;
    align-items: center; justify-content: center; padding: 16px; }
  .modal.open { display: flex; }
  .modal-box { background: #fff; border-radius: var(--radius); padding: 22px 24px; width: 100%; max-width: 480px;
    max-height: 90vh; overflow-y: auto; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

  /* Rubric */
  .rubric-domain { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .rubric-domain h4 { margin-bottom: 10px; color: var(--primary-dark); }
  .rubric-item { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 0; border-top: 1px dashed var(--border); }
  .rubric-item:first-of-type { border-top: none; }
  .rubric-item-label { font-size: 13.5px; flex: 1; }
  .rate { display: flex; gap: 4px; }
  .rate button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: #fff;
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .rate button.selected { background: var(--primary); border-color: var(--primary); color: #fff; }
  .score-summary { background: #f8f9fc; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    margin: 10px 0 16px; display: flex; gap: 24px; flex-wrap: wrap; }
  .score-summary .ss-item { font-size: 13.5px; }
  .score-summary .ss-item b { font-size: 16px; display: block; }

  /* Lists / evidence grid */
  .list { display: flex; flex-direction: column; gap: 8px; max-height: 560px; overflow-y: auto; }
  .list-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .list-item:hover { border-color: var(--primary); }
  .list-item.active { border-color: var(--primary); background: #eef2ff; }
  .list-item .li-top { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; }
  .list-item .li-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

  .split-layout { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
  .empty-state { color: var(--text-muted); text-align: center; padding: 40px 10px; font-size: 14px; }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .evd-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .evd-card .evd-icon { font-size: 26px; margin-bottom: 8px; }
  .evd-card .evd-name { font-weight: 600; font-size: 13.5px; word-break: break-word; }
  .evd-card .evd-meta { font-size: 12px; color: var(--text-muted); margin: 4px 0 10px; }
  .evd-card .evd-actions { display: flex; gap: 8px; }
  .evd-card .evd-actions a, .evd-card .evd-actions button { font-size: 12.5px; }

  /* Toast */
  .toast { position: fixed; bottom: 20px; right: 20px; background: #1e2130; color: #fff; padding: 12px 18px;
    border-radius: 10px; font-size: 13.5px; opacity: 0; transform: translateY(8px); transition: all .25s ease; z-index: 200; }
  .toast.show { opacity: 1; transform: none; }
  .toast-error { background: #c62828; }
  .toast-success { background: #2e7d32; }

  @media (max-width: 960px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .card-grid-2 { grid-template-columns: 1fr; }
    .split-layout { grid-template-columns: 1fr; }
    .form-row-3 { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .sidebar { transform: translateX(-100%); width: 260px; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-btn { display: block; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
